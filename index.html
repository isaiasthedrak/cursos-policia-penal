<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site com Navbar e Área de Cursos</title>
  
  
</head>
<body>
  <!-- ===== NAVBAR NO CANTO SUPERIOR DIREITO ===== -->
  <header>
    <button class="menu-toggle" onclick="toggleMenu()">Menu</button>
    <nav class="navbar" id="navbar">
      <a href="#">Início</a>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <!-- ===== CONTEÚDO CENTRAL - CURSOS DA FACULDADE ===== -->
  <main>
    <div class="slide-area">
      <!-- Curso: Engenharia -->
      <div class="course-section">
        <h2>Engenharia</h2>
        <div class="course-grid">
          <div class="course-box">Engenharia Civil</div>
          <div class="course-box">Engenharia Mecânica</div>
          <div class="course-box">Engenharia Elétrica</div>
        </div>
      </div>

      <!-- Curso: Saúde -->
      <div class="course-section">
        <h2>Saúde</h2>
        <div class="course-grid">
          <div class="course-box">Enfermagem</div>
          <div class="course-box">Medicina</div>
          <div class="course-box">Farmácia</div>
        </div>
      </div>

      <!-- Curso: Tecnologia -->
      <div class="course-section">
        <h2>Tecnologia</h2>
        <div class="course-grid">
          <div class="course-box">Análise de Sistemas</div>
          <div class="course-box">Ciência da Computação</div>
          <div class="course-box">Engenharia de Software</div>
        </div>
      </div>

      <div class="course-section">
        <h2>Tecnologia</h2>
        <div class="course-grid">
          <div class="course-box">Análise de Sistemas</div>
          <div class="course-box">Ciência da Computação</div>
          <div class="course-box">Engenharia de Software</div>
        </div>
      </div>
      <!-- Adicione mais seções conforme necessário -->
    </div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('navbar').classList.toggle('show');
    }
  </script>
</body>
</html>
